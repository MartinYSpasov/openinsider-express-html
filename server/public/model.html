<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Model — Single Stock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- was /css/model.css but your file is in /public/model.css -->
    <link rel="stylesheet" href="/model.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<main class="wrap">
    <header class="header">
        <h1 id="title">Model Dashboard</h1>
        <form id="form" class="form">
            <input id="ticker" name="ticker" placeholder="AAPL" />
            <input id="start" name="start" type="date" />
            <input id="end"   name="end" type="date" />
            <label><input type="checkbox" id="backtest" /> backtest</label>
            <button>Run</button>
        </form>
    </header>

    <section class="cards">
        <div class="card">
            <div class="card-title">Next-day signal</div>
            <div class="signal">
                <div id="signalValue" class="signal-value">--</div>
                <div id="signalBadge" class="signal-badge neutral">NEUTRAL</div>
            </div>
            <div class="meta">
                <div>Asof: <span id="asof">—</span></div>
                <div>Model: <span id="modelName">hgb</span></div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">CV (walk-forward)</div>
            <div class="kv">
                <div><span>Splits</span><b id="cvSplits">—</b></div>
                <div><span>MAE</span><b id="cvMAE">—</b></div>
                <div><span>MSE</span><b id="cvMSE">—</b></div>
                <div><span>R²</span><b id="cvR2">—</b></div>
            </div>
        </div>
    </section>

    <section class="grid">
        <div class="panel">
            <h2>Price (close) vs predicted next-day return</h2>
            <canvas id="priceChart" height="120"></canvas>
        </div>
        <div class="panel">
            <h2>Predictions (last 30)</h2>
            <canvas id="predChart" height="120"></canvas>
        </div>
    </section>

    <section class="panel" id="backtestPanel" style="display:none">
        <h2>Backtest summary</h2>
        <div class="kv">
            <div><span>CAGR</span><b id="btCAGR">—</b></div>
            <div><span>Sharpe</span><b id="btSharpe">—</b></div>
            <div><span>Max DD</span><b id="btMaxDD">—</b></div>
            <div><span>Trades</span><b id="btTrades">—</b></div>
        </div>
        <details>
            <summary>Show last 20 trades</summary>
            <table id="tradesTbl"><thead><tr>
                <th>Date</th><th>Side</th><th>Price</th><th>P&L</th>
            </tr></thead><tbody></tbody></table>
        </details>
    </section>
</main>

<script src="/js/model.js" type="module"></script>
</body>
</html>
